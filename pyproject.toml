[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auklet"
version = "2.0.0"
description = "A browser engine and browser UI written from scratch: HTTP/1.1+TLS, HTML parsing, CSS cascade, grid/flex layout, rasterisation and a JavaScript runtime."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Auklet contributors" }]
keywords = ["browser", "engine", "html", "css", "layout", "rendering", "javascript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["Pillow>=9.0.0", "quickjs>=1.19.0", "numpy>=1.21.0", "brotli>=1.0.9"]

[project.urls]
Homepage = "https://github.com/maxgish39-ux/auklet-browser-engine"
Source = "https://github.com/maxgish39-ux/auklet-browser-engine"

[project.scripts]
auklet = "auklet.cli:main"
auklet-browser = "auklet.ui:main"

[tool.setuptools.packages.find]
include = ["auklet*"]
