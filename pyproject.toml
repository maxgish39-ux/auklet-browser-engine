[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auklet"
version = "1.0.0"
description = "A browser engine written from scratch: HTML parsing, CSS cascade, layout, rasterisation and a JavaScript runtime."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Auklet contributors" }]
keywords = ["browser", "engine", "html", "css", "layout", "rendering", "javascript"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["Pillow>=9.0.0", "quickjs>=1.19.0"]

[project.urls]
Homepage = "https://github.com/maxgish39-ux/auklet-browser-engine"
Source = "https://github.com/maxgish39-ux/auklet-browser-engine"

[project.scripts]
auklet = "auklet.cli:main"

[tool.setuptools]
packages = ["auklet"]
